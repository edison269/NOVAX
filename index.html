<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Nova</title>
<style>
:root{--azul:#4aa8ff;--fondo:#000;--brillo:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:#cfe6ff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
header b{letter-spacing:.5em;font-weight:400;color:var(--azul)}
#gear{width:46px;height:46px;border-radius:50%;border:1px solid #17304d;background:#050b14;color:var(--azul);font-size:22px}
#stage{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#msg{max-height:24vh;overflow:auto;border-left:2px solid #2a5a8c;padding:8px 12px;margin:6px 0;font-size:15px;line-height:1.45;background:linear-gradient(90deg,#06101c,transparent);white-space:pre-wrap}
#msg:empty{display:none}
#kb{display:none;border:1px solid #cfe6ff;border-right:0;margin:8px 0;background:#050b14}
#kb.on{display:flex}
#kb span{padding:14px 10px;color:var(--azul)}
#kb input{flex:1;background:none;border:0;color:#cfe6ff;font:inherit;font-size:16px;outline:none}
#kb button{background:none;border:0;color:var(--azul);font-size:26px;padding:0 16px}
#mic{align-self:center;width:84px;height:92px;border:0;background:none;padding:0;margin:6px 0}
#mic svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #2d8cff)}
#mic.on svg{filter:drop-shadow(0 0 18px #9fd0ff)}
nav{display:flex;justify-content:space-around;padding:10px 0 16px}
nav button{background:none;border:0;border-bottom:1px solid #1d3550;color:#6f8aa8;font:inherit;letter-spacing:.3em;font-size:13px;padding:8px 14px}
nav button.on{color:#e6f2ff;border-color:var(--azul)}
#ajustes{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#ajustes.on{display:flex}
#panel{width:100%;max-width:380px;background:#06101c;border:1px solid #17304d;padding:20px}
#panel label{display:block;margin:14px 0 6px;font-size:13px;color:#8fb4da}
#panel input[type=password],#panel input[type=text]{width:100%;padding:10px;background:#000;border:1px solid #234;color:#cfe6ff;font:inherit}
#panel input[type=range]{width:100%}
#panel button{margin-top:18px;width:100%;padding:12px;background:#0b2036;border:1px solid var(--azul);color:#e6f2ff;font:inherit}
small{display:block;margin-top:12px;color:#6f8aa8;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <header><b>NOVA</b><button id="gear" aria-label="Ajustes">⚙</button></header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="msg"></div>
  <div id="kb"><span>&gt;</span><input id="txt" placeholder="Escribe aquí…" autocomplete="off"><button id="send" aria-label="Enviar">›</button></div>
  <button id="mic" aria-label="Hablar"><svg viewBox="0 0 100 110" fill="none" stroke="#4aa8ff" stroke-width="4" stroke-linejoin="round"><path d="M50 4 94 29v52L50 106 6 81V29z"/><rect x="39" y="26" width="22" height="38" rx="11"/><path d="M30 54a20 20 0 0 0 40 0M50 74v14M38 88h24"/></svg></button>
  <nav><button id="tVoz" class="on">VOZ</button><button id="tTec">TECLADO</button><button id="tAju">AJUSTES</button></nav>
</div>

<div id="ajustes"><div id="panel">
  <b style="color:#4aa8ff;letter-spacing:.3em">AJUSTES</b>
  <label>Clave de Gemini</label>
  <input id="clave" type="password" placeholder="Pega tu clave aquí" autocomplete="off">
  <label>Brillo del diamante</label>
  <input id="brillo" type="range" min="0.4" max="1.6" step="0.05" value="1">
  <button id="cerrar">Guardar y cerrar</button>
  <small>Para borrar la memoria de Nova, mantén apretada la esfera.</small>
</div></div>

<script>
// ====== CONFIGURACIÓN ======
// Si Google vuelve a retirar el modelo, solo cambia esta línea:
const MODELO = "gemini-3.8-flash";
const SISTEMA = "Eres Nova, una asistente de IA tipo Jarvis. Respondes en español, de forma clara, cálida y breve (máximo 3 frases) porque tus respuestas se leen en voz alta.";

// ====== ALMACENAMIENTO ======
const $ = id => document.getElementById(id);
const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let memoria = []; try { memoria = JSON.parse(get("nova_mem", "[]")); } catch (e) {}
const guardarMem = () => set("nova_mem", JSON.stringify(memoria.slice(-30)));

// ====== GEMINI ======
async function preguntar(texto) {
  const clave = get("nova_clave", "");
  if (!clave) { abrirAjustes(); throw new Error("Falta tu clave de Gemini. Ponla en Ajustes."); }
  memoria.push({ role: "user", parts: [{ text: texto }] });
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + MODELO + ":generateContent";
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": clave },
    body: JSON.stringify({ systemInstruction: { parts: [{ text: SISTEMA }] }, contents: memoria.slice(-30) })
  });
  const d = await r.json();
  if (!r.ok) { memoria.pop(); throw new Error((d.error && d.error.message) || ("Error " + r.status)); }
  const resp = (d.candidates && d.candidates[0] && d.candidates[0].content.parts.map(p => p.text || "").join("")) || "No obtuve respuesta.";
  memoria.push({ role: "model", parts: [{ text: resp }] });
  guardarMem();
  return resp;
}

async function enviar(texto) {
  texto = (texto || "").trim(); if (!texto) return;
  $("msg").textContent = "…";
  try { const r = await preguntar(texto); $("msg").textContent = r; hablar(r); }
  catch (e) { $("msg").textContent = "No pude conectar con Gemini: " + e.message; }
}

// ====== VOZ ======
let vozEs = null;
function cargarVoz() {
  const v = speechSynthesis.getVoices().filter(x => x.lang.toLowerCase().startsWith("es"));
  vozEs = v.find(x => /natural|neural|google|online/i.test(x.name)) || v[0] || null;
}
if ("speechSynthesis" in window) { cargarVoz(); speechSynthesis.onvoiceschanged = cargarVoz; }
function hablar(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const partes = t.replace(/[*_#`]/g, "").match(/[^.!?\n]+[.!?]?/g) || [t];
  partes.forEach(p => { const u = new SpeechSynthesisUtterance(p.trim()); u.lang = "es-ES"; if (vozEs) u.voice = vozEs; u.rate = 1.03; u.pitch = 1; speechSynthesis.speak(u); });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false;
$("mic").onclick = () => {
  if (!SR) { $("msg").textContent = "Este navegador no permite voz. Usa Chrome."; return; }
  if (escuchando && rec) { rec.stop(); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "es-ES"; rec.interimResults = false;
  rec.onstart = () => { escuchando = true; $("mic").classList.add("on"); };
  rec.onend = () => { escuchando = false; $("mic").classList.remove("on"); };
  rec.onerror = e => { $("msg").textContent = "Micrófono: " + e.error; };
  rec.onresult = e => { const t = e.results[0][0].transcript; $("msg").textContent = "> " + t; enviar(t); };
  rec.start();
};

// ====== PESTAÑAS Y AJUSTES ======
function modo(t) { $("tVoz").classList.toggle("on", t === "voz"); $("tTec").classList.toggle("on", t === "tec"); $("kb").classList.toggle("on", t === "tec"); if (t === "tec") $("txt").focus(); }
$("tVoz").onclick = () => modo("voz"); $("tTec").onclick = () => modo("tec");
$("send").onclick = () => { const t = $("txt").value; $("txt").value = ""; enviar(t); };
$("txt").onkeydown = e => { if (e.key === "Enter") $("send").click(); };
function abrirAjustes() { $("clave").value = get("nova_clave", ""); $("brillo").value = get("nova_brillo", "1"); $("ajustes").classList.add("on"); }
$("gear").onclick = abrirAjustes; $("tAju").onclick = abrirAjustes;
$("brillo").oninput = e => { brillo = +e.target.value; };
$("cerrar").onclick = () => { set("nova_clave", $("clave").value.trim()); set("nova_brillo", $("brillo").value); $("ajustes").classList.remove("on"); };
let brillo = +get("nova_brillo", "1");

// ====== ESFERA 3D ======
const cv = $("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function ajustar() { DPR = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener("resize", ajustar); ajustar();

const N = 170, pts = [];
for (let i = 0; i < N; i++) {
  const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.39996;
  const k = .78 + Math.random() * .3;
  pts.push({ x: Math.cos(a) * r * k, y: y * k, z: Math.sin(a) * r * k, d: Math.random() * .6 });
}
const lineas = [];
for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
  const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, dz = pts[i].z - pts[j].z;
  if (dx * dx + dy * dy + dz * dz < .16) lineas.push([i, j]);
}
let ang = 0, t0 = performance.now(), arrastre = 0, giroExtra = 0;

function frame(now) {
  const t = (now - t0) / 1000;
  const build = Math.min(1, t / 2.4); // animación de creación solo al abrir
  ang += .004 + giroExtra; giroExtra *= .95;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  const R = Math.min(W, H) * .46, cx = W / 2, cy = H / 2, ca = Math.cos(ang), sa = Math.sin(ang);
  const P = pts.map(p => {
    const e = Math.max(0, Math.min(1, (build - p.d) / .4));
    const s = e * e * (3 - 2 * e);
    const x = p.x * ca + p.z * sa, z = -p.x * sa + p.z * ca, f = 1 / (1.8 - z * .5);
    return { X: cx + x * R * s * f * 1.5, Y: cy + p.y * R * s * f * 1.5, z, s };
  });
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = .7;
  for (const [i, j] of lineas) {
    const a = P[i], b = P[j], o = Math.min(a.s, b.s) * (.12 + .25 * ((a.z + b.z + 2) / 4));
    if (o < .01) continue;
    ctx.strokeStyle = "rgba(140,200,255," + o + ")"; ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();
  }
  for (const p of P) {
    if (p.s < .01) continue;
    const r = (1.6 + (p.z + 1) * 1.6) * p.s, g = ctx.createRadialGradient(p.X, p.Y, 0, p.X, p.Y, r * 4);
    g.addColorStop(0, "rgba(220,240,255," + .9 * p.s + ")"); g.addColorStop(.3, "rgba(70,150,255," + .45 * p.s + ")"); g.addColorStop(1, "rgba(30,90,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.X, p.Y, r * 4, 0, 6.3); ctx.fill();
  }
  // núcleo: diamante brillante en el centro
  const pulso = (1 + .06 * Math.sin(t * 2)) * build * brillo, dm = R * .13 * pulso;
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, dm * 5);
  halo.addColorStop(0, "rgba(150,210,255," + .55 * Math.min(1, brillo) + ")"); halo.addColorStop(1, "rgba(40,110,255,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, dm * 5, 0, 6.3); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#7cc0ff"; ctx.shadowBlur = 25 * brillo;
  ctx.beginPath(); ctx.moveTo(cx, cy - dm * 1.5); ctx.lineTo(cx + dm, cy); ctx.lineTo(cx, cy + dm * 1.5); ctx.lineTo(cx - dm, cy); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Mantener apretada la esfera = borrar memoria
let timer = null, ox = 0;
cv.addEventListener("pointerdown", e => {
  ox = e.clientX;
  timer = setTimeout(() => {
    timer = null;
    if (confirm("¿Borrar la memoria de Nova?")) { memoria = []; guardarMem(); $("msg").textContent = "Memoria borrada."; }
  }, 1200);
});
cv.addEventListener("pointermove", e => { if (timer && Math.abs(e.clientX - ox) > 12) { clearTimeout(timer); timer = null; } giroExtra += (e.movementX || 0) * .0004; });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => cv.addEventListener(ev, () => { if (timer) { clearTimeout(timer); timer = null; } }));

// Instalable desde Chrome (sin archivos extra)
</script>
</body>
</html>
