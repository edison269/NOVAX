<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Nova</title>
<style>
  :root { --bg:#000; --azul:#5fb4ff; --blanco:#eaf6ff; --tenue:#6f8fb0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--blanco); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0; display:flex; justify-content:space-between; align-items:center; z-index:5; }
  .marca { letter-spacing:.32em; font-weight:300; font-size:15px; color:var(--azul); text-shadow:0 0 12px rgba(95,180,255,.7); }
  .btn-ico { background:rgba(95,180,255,.08); border:1px solid rgba(95,180,255,.35); color:var(--azul); width:40px; height:40px; border-radius:50%; font-size:18px; display:grid; place-items:center; }
  .iconos { display:flex; gap:8px; }
  .bottom { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px); z-index:5; display:flex; flex-direction:column; align-items:center; gap:12px; }
  #texto { min-height:3.6em; max-height:7.5em; overflow:auto; width:100%; max-width:560px; text-align:center; font-size:16px; line-height:1.45; color:var(--blanco); text-shadow:0 0 10px rgba(95,180,255,.35); }
  #estado { font-size:13px; color:var(--tenue); height:1.2em; }
  .fila { display:flex; gap:10px; width:100%; max-width:560px; align-items:center; }
  #entrada { flex:1; background:rgba(95,180,255,.07); border:1px solid rgba(95,180,255,.3); border-radius:22px; padding:12px 16px; color:var(--blanco); font-size:16px; outline:none; }
  #entrada:focus-visible, button:focus-visible { outline:2px solid var(--blanco); outline-offset:2px; }
  #mic { width:56px; height:56px; border-radius:50%; border:1.5px solid var(--azul); background:radial-gradient(circle at 50% 40%, rgba(95,180,255,.35), rgba(95,180,255,.06)); color:var(--blanco); font-size:22px; box-shadow:0 0 18px rgba(95,180,255,.45); flex:none; }
  #mic.on { background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.6), rgba(95,180,255,.3)); box-shadow:0 0 28px rgba(160,215,255,.9); }
  .panel { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:10; display:none; align-items:center; justify-content:center; padding:20px; }
  .panel.abierto { display:flex; }
  .caja { width:100%; max-width:440px; background:#050b14; border:1px solid rgba(95,180,255,.4); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow:auto; }
  .caja h2 { margin:0; font-size:18px; font-weight:500; color:var(--azul); }
  .caja p, .caja label { margin:0; font-size:14px; line-height:1.5; color:#b9d3ea; }
  .caja input, .caja select { width:100%; background:#02060c; border:1px solid rgba(95,180,255,.35); border-radius:10px; padding:11px 12px; color:var(--blanco); font-size:15px; }
  .caja button { border-radius:10px; padding:12px; font-size:15px; border:1px solid rgba(95,180,255,.5); background:rgba(95,180,255,.14); color:var(--blanco); }
  .caja button.peligro { border-color:rgba(255,120,120,.5); background:rgba(255,120,120,.1); }
  #recuerdos { font-size:13px; color:#9fbad3; white-space:pre-wrap; background:#02060c; border-radius:10px; padding:10px; max-height:140px; overflow:auto; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<canvas id="lienzo" aria-label="Esfera de Nova"></canvas>

<div class="top">
  <div class="marca">NOVA</div>
  <div class="iconos">
    <button class="btn-ico" id="abrirAjustes" aria-label="Ajustes">⚙</button>
  </div>
</div>

<div class="bottom">
  <div id="texto" aria-live="polite"></div>
  <div id="estado"></div>
  <div class="fila">
    <input id="entrada" type="text" placeholder="Escríbele a Nova" autocomplete="off" enterkeyhint="send">
    <button id="mic" aria-label="Hablar con Nova">🎙</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="caja">
    <h2>Ajustes de Nova</h2>
    <label for="clave">Clave de Gemini</label>
    <input id="clave" type="password" placeholder="Pega aquí tu clave" autocomplete="off">
    <label for="vozSel">Voz</label>
    <select id="vozSel"></select>
    <label for="velocidad">Velocidad de la voz</label>
    <input id="velocidad" type="range" min="0.8" max="1.3" step="0.05" value="1.05">
    <p>Lo que Nova recuerda de ti:</p>
    <div id="recuerdos">Todavía nada.</div>
    <button id="guardar">Guardar</button>
    <button id="borrarMem" class="peligro">Borrar memoria de Nova</button>
    <button id="cerrar">Cerrar</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Almacenamiento seguro ---------- */
  function leer(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var memoria = { hechos: [], historial: [] };
  try { var m = JSON.parse(leer('nova_mem', '')); if (m && m.hechos && m.historial) memoria = m; } catch (e) {}
  function guardarMemoria() {
    memoria.historial = memoria.historial.slice(-30);
    memoria.hechos = memoria.hechos.slice(-60);
    guardar('nova_mem', JSON.stringify(memoria));
  }

  /* ---------- Esfera de plasma ---------- */
  var cv = document.getElementById('lienzo');
  var cx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, R = 100;
  function ajustar() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.min(W * 0.4, H * 0.27);
  }
  window.addEventListener('resize', ajustar);
  ajustar();

  var N = 380;
  var pts = [], aristas = [];
  (function crear() {
    var dorado = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < N; i++) {
      var y = 1 - (i / (N - 1)) * 2;
      var r = Math.sqrt(1 - y * y);
      var th = dorado * i;
      // irregularidad: la esfera no es perfecta
      var irr = 1 + (Math.random() - 0.5) * 0.22;
      var x = Math.cos(th) * r * irr, z = Math.sin(th) * r * irr;
      var yy = y * irr;
      var d = 2.2 + Math.random() * 2.2, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
      pts.push({
        x: x, y: yy, z: z,
        sx: d * Math.sin(b) * Math.cos(a), sy: d * Math.cos(b), sz: d * Math.sin(b) * Math.sin(a),
        delay: Math.random() * 1.9, fase: Math.random() * 6.283, tam: 0.8 + Math.random() * 1.6,
        p: 0
      });
    }
    var vistos = {};
    for (var i2 = 0; i2 < N; i2++) {
      var ds = [];
      for (var j = 0; j < N; j++) {
        if (j === i2) continue;
        var dx = pts[i2].x - pts[j].x, dy = pts[i2].y - pts[j].y, dz = pts[i2].z - pts[j].z;
        ds.push({ j: j, d: dx * dx + dy * dy + dz * dz });
      }
      ds.sort(function (p, q) { return p.d - q.d; });
      var k = 3 + (Math.random() < 0.35 ? 1 : 0);
      for (var n = 0; n < k; n++) {
        var a2 = Math.min(i2, ds[n].j), b2 = Math.max(i2, ds[n].j), key = a2 + '_' + b2;
        if (!vistos[key]) { vistos[key] = 1; aristas.push([a2, b2]); }
      }
    }
  })();

  var estado = 'reposo'; // reposo | escuchando | pensando | hablando
  var t0 = performance.now();
  var rotY = 0, rotX = 0.35, nivel = 0, nivelObj = 0;
  var arrastre = null, velY = 0;
  var proy = new Array(N);
  for (var q = 0; q < N; q++) proy[q] = { x: 0, y: 0, z: 0, p: 0 };

  function suave(x) { x = x < 0 ? 0 : x > 1 ? 1 : x; return 1 - Math.pow(1 - x, 3); }

  function dibujar(ahora) {
    var t = (ahora - t0) / 1000;
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, W, H);

    nivelObj = estado === 'hablando' ? 0.05 + 0.05 * (Math.sin(t * 9) * 0.5 + 0.5) * (0.6 + 0.4 * Math.sin(t * 3.1)) :
               estado === 'escuchando' ? 0.03 + 0.012 * Math.sin(t * 3) :
               estado === 'pensando' ? 0.02 + 0.02 * Math.sin(t * 6) : 0.012 * Math.sin(t * 1.2);
    nivel += (nivelObj - nivel) * 0.12;

    if (!arrastre) { velY += (0.0035 + (estado === 'pensando' ? 0.006 : 0) - velY) * 0.03; rotY += velY; }
    var cy = Math.cos(rotY), sy = Math.sin(rotY), cxx = Math.cos(rotX), sxx = Math.sin(rotX);
    var ox = W / 2, oy = H * 0.42;

    var fin = true;
    for (var i = 0; i < N; i++) {
      var p = pts[i], pr = proy[i];
      var prog = suave((t - 0.3 - p.delay) / 1.7);
      p.p = prog; if (prog < 1) fin = false;
      var onda = 1 + nivel * Math.sin(t * 5 + p.fase * 3) + 0.018 * Math.sin(t * 1.4 + p.fase);
      var x = (p.sx + (p.x - p.sx) * prog) * onda;
      var y = (p.sy + (p.y - p.sy) * prog) * onda;
      var z = (p.sz + (p.z - p.sz) * prog) * onda;
      var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      var y2 = y * cxx - z1 * sxx, z2 = y * sxx + z1 * cxx;
      var esc = 1 / (1 - z2 * 0.18);
      pr.x = ox + x1 * R * esc; pr.y = oy + y2 * R * esc; pr.z = z2; pr.p = prog;
    }

    cx.globalCompositeOperation = 'lighter';
    var brillo = estado === 'escuchando' ? 1.25 : 1;
    cx.lineWidth = 0.7;
    for (var e = 0; e < aristas.length; e++) {
      var A = proy[aristas[e][0]], B = proy[aristas[e][1]];
      var vis = Math.min(A.p, B.p); if (vis < 0.02) continue;
      var prof = ((A.z + B.z) * 0.5 + 1) * 0.5;
      var al = (0.08 + prof * 0.4) * vis * brillo;
      cx.strokeStyle = 'rgba(' + (110 + prof * 120 | 0) + ',' + (185 + prof * 60 | 0) + ',255,' + al.toFixed(3) + ')';
      cx.beginPath(); cx.moveTo(A.x, A.y); cx.lineTo(B.x, B.y); cx.stroke();
    }
    for (var i3 = 0; i3 < N; i3++) {
      var P = proy[i3], q2 = pts[i3];
      if (P.p < 0.01) continue;
      var pf = (P.z + 1) * 0.5;
      var rad = q2.tam * (0.7 + pf * 1.1) * (R / 150 + 0.5);
      var a = (0.35 + pf * 0.65) * Math.min(1, P.p * 1.5) * brillo;
      var g = cx.createRadialGradient(P.x, P.y, 0, P.x, P.y, rad * 3.2);
      g.addColorStop(0, 'rgba(235,248,255,' + Math.min(1, a).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(110,190,255,' + (a * 0.5).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(60,140,255,0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(P.x, P.y, rad * 3.2, 0, 6.283); cx.fill();
    }
    // resplandor central
    var gl = cx.createRadialGradient(ox, oy, 0, ox, oy, R * 1.25);
    gl.addColorStop(0, 'rgba(120,190,255,' + (0.1 + nivel * 2).toFixed(3) + ')');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gl; cx.fillRect(0, 0, W, H);

    requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(dibujar);

  // arrastrar para girar la esfera
  cv.addEventListener('pointerdown', function (e) { arrastre = { x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
  cv.addEventListener('pointermove', function (e) {
    if (!arrastre) return;
    var dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
    rotY += dx * 0.008; velY = dx * 0.0008; rotX = Math.max(-1.2, Math.min(1.2, rotX + dy * 0.006));
    arrastre = { x: e.clientX, y: e.clientY };
  });
  function soltar() { arrastre = null; }
  cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);

  /* ---------- Interfaz ---------- */
  var elTexto = document.getElementById('texto');
  var elEstado = document.getElementById('estado');
  var elEntrada = document.getElementById('entrada');
  var btnMic = document.getElementById('mic');
  function ponerEstado(s, etiqueta) { estado = s; elEstado.textContent = etiqueta || ''; btnMic.classList.toggle('on', s === 'escuchando'); }
  function mostrar(txt) { elTexto.textContent = txt; elTexto.scrollTop = elTexto.scrollHeight; }

  /* ---------- Voz de salida ---------- */
  var voces = [], vozElegida = leer('nova_voz', '');
  var velocidad = parseFloat(leer('nova_vel', '1.05')) || 1.05;
  function puntuar(v) {
    var s = 0, n = (v.name || '').toLowerCase();
    if (/natural|neural|online|premium|enhanced|google/.test(n)) s += 5;
    if (/^es[-_]mx|^es[-_]us|^es[-_]419/i.test(v.lang)) s += 2;
    if (/^es/i.test(v.lang)) s += 10;
    if (v.localService === false) s += 1;
    return s;
  }
  function cargarVoces() {
    if (!window.speechSynthesis) return;
    voces = speechSynthesis.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
    voces.sort(function (a, b) { return puntuar(b) - puntuar(a); });
    var sel = document.getElementById('vozSel');
    sel.innerHTML = '';
    if (!voces.length) { var o = document.createElement('option'); o.textContent = 'Voz del sistema'; sel.appendChild(o); return; }
    voces.forEach(function (v) {
      var o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
      if (v.name === vozElegida) o.selected = true; sel.appendChild(o);
    });
  }
  if (window.speechSynthesis) { cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }

  var conversacion = false; // si está activo, Nova vuelve a escuchar tras hablar
  function limpiarParaVoz(t) { return t.replace(/[*_`#>]+/g, '').replace(/\s+/g, ' ').trim(); }
  function hablar(texto, alTerminar) {
    if (!window.speechSynthesis) { if (alTerminar) alTerminar(); return; }
    speechSynthesis.cancel();
    var limpio = limpiarParaVoz(texto);
    var frases = limpio.match(/[^.!?¡¿\n]+[.!?]*/g) || [limpio];
    var elegida = null;
    for (var i = 0; i < voces.length; i++) if (voces[i].name === vozElegida) elegida = voces[i];
    if (!elegida && voces.length) elegida = voces[0];
    var pendientes = frases.filter(function (f) { return f.trim(); });
    if (!pendientes.length) { if (alTerminar) alTerminar(); return; }
    ponerEstado('hablando', 'Nova está hablando');
    pendientes.forEach(function (f, idx) {
      var u = new SpeechSynthesisUtterance(f.trim());
      if (elegida) { u.voice = elegida; u.lang = elegida.lang; } else u.lang = 'es-ES';
      u.rate = velocidad; u.pitch = 1;
      if (idx === pendientes.length - 1) {
        u.onend = function () { ponerEstado('reposo', ''); if (alTerminar) alTerminar(); };
        u.onerror = u.onend;
      }
      speechSynthesis.speak(u);
    });
  }

  /* ---------- Reconocimiento de voz ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, escuchando = false;
  function iniciarEscucha() {
    if (!SR) { mostrar('Este navegador no permite escuchar la voz. Abre Nova en Chrome o escribe tu mensaje.'); return; }
    if (escuchando) return;
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec = new SR(); rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = false;
    var final = '';
    rec.onstart = function () { escuchando = true; ponerEstado('escuchando', 'Te escucho…'); };
    rec.onresult = function (ev) {
      var parcial = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) final += ev.results[i][0].transcript; else parcial += ev.results[i][0].transcript;
      }
      mostrar(final + parcial);
    };
    rec.onerror = function (ev) {
      escuchando = false; conversacion = false;
      var msg = ev.error === 'not-allowed' ? 'Permite el micrófono para que Nova te escuche.' : ev.error === 'no-speech' ? 'No te oí. Toca el micrófono y habla.' : 'No pude escucharte. Intenta de nuevo.';
      ponerEstado('reposo', ''); mostrar(msg);
    };
    rec.onend = function () {
      escuchando = false;
      if (final.trim()) enviar(final.trim());
      else if (estado === 'escuchando') ponerEstado('reposo', '');
    };
    try { rec.start(); } catch (e) {}
  }
  btnMic.addEventListener('click', function () {
    if (escuchando) { conversacion = false; try { rec.stop(); } catch (e) {} return; }
    conversacion = true; iniciarEscucha();
  });

  /* ---------- Cerebro: Gemini + memoria ---------- */
  function sistema() {
    var hechos = memoria.hechos.length ? memoria.hechos.map(function (h) { return '- ' + h; }).join('\n') : '(todavía no sabes nada del usuario)';
    return 'Eres Nova, una asistente de IA tipo Jarvis: cercana, inteligente y directa. Hablas en español natural, con frases cortas pensadas para ser dichas en voz alta. ' +
      'No uses listas, asteriscos ni emojis. Responde en 1 a 3 frases salvo que te pidan más.\n' +
      'Esto es lo que recuerdas del usuario:\n' + hechos + '\n' +
      'Si el usuario te pide recordar algo o dice un dato personal duradero, añade al final de tu respuesta una línea con el formato [[RECORDAR: dato breve]]. ' +
      'Si te pide olvidar algo, añade [[OLVIDAR: palabra clave]]. Esas líneas no se dicen en voz alta.\n' +
      'No puedes controlar el teléfono del usuario ni abrir aplicaciones; si te lo piden, dilo con claridad.';
  }
  function procesarMarcas(texto) {
    var cambios = false;
    texto = texto.replace(/\[\[RECORDAR:\s*([^\]]+)\]\]/gi, function (_, h) { memoria.hechos.push(h.trim()); cambios = true; return ''; });
    texto = texto.replace(/\[\[OLVIDAR:\s*([^\]]+)\]\]/gi, function (_, k) {
      var kk = k.trim().toLowerCase();
      memoria.hechos = memoria.hechos.filter(function (h) { return h.toLowerCase().indexOf(kk) === -1; }); cambios = true; return '';
    });
    if (cambios) guardarMemoria();
    return texto.trim();
  }

  var ocupado = false;
  function enviar(texto) {
    if (ocupado || !texto) return;
    var clave = leer('nova_clave', '');
    mostrar(texto);
    if (!clave) { abrirPanel(); mostrar('Pega tu clave de Gemini en Ajustes para que Nova pueda responder.'); ponerEstado('reposo', ''); return; }
    ocupado = true; ponerEstado('pensando', 'Pensando…');
    memoria.historial.push({ r: 'user', t: texto });
    var contenido = memoria.historial.slice(-12).map(function (m) { return { role: m.r === 'user' ? 'user' : 'model', parts: [{ text: m.t }] }; });
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(clave);
    fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sistema() }] }, contents: contenido, generationConfig: { temperature: 0.8, maxOutputTokens: 400 } })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || 'Error de Gemini');
      var parts = res.j.candidates && res.j.candidates[0] && res.j.candidates[0].content && res.j.candidates[0].content.parts;
      var bruto = parts ? parts.map(function (p) { return p.text || ''; }).join('') : '';
      var resp = procesarMarcas(bruto) || 'No supe qué responder. ¿Me lo repites?';
      memoria.historial.push({ r: 'model', t: resp }); guardarMemoria();
      mostrar(resp); ocupado = false;
      hablar(resp, function () { if (conversacion) iniciarEscucha(); });
    }).catch(function (err) {
      ocupado = false; conversacion = false; memoria.historial.pop(); ponerEstado('reposo', '');
      var m = String(err.message || err);
      mostrar(/API key|invalid|permission/i.test(m) ? 'La clave de Gemini no funciona. Revísala en Ajustes.' : 'No pude conectar con Gemini: ' + m);
    });
  }
  elEntrada.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var v = elEntrada.value.trim(); elEntrada.value = ''; conversacion = false; enviar(v); }
  });

  /* ---------- Ajustes ---------- */
  var panel = document.getElementById('panel');
  function pintarRecuerdos() {
    document.getElementById('recuerdos').textContent = memoria.hechos.length ? memoria.hechos.map(function (h) { return '• ' + h; }).join('\n') : 'Todavía nada.';
  }
  function abrirPanel() {
    document.getElementById('clave').value = leer('nova_clave', '');
    document.getElementById('velocidad').value = velocidad;
    cargarVoces(); pintarRecuerdos(); panel.classList.add('abierto');
  }
  document.getElementById('abrirAjustes').addEventListener('click', abrirPanel);
  document.getElementById('cerrar').addEventListener('click', function () { panel.classList.remove('abierto'); });
  document.getElementById('guardar').addEventListener('click', function () {
    guardar('nova_clave', document.getElementById('clave').value.trim());
    var sel = document.getElementById('vozSel'); if (sel.value) { vozElegida = sel.value; guardar('nova_voz', vozElegida); }
    velocidad = parseFloat(document.getElementById('velocidad').value) || 1.05; guardar('nova_vel', String(velocidad));
    panel.classList.remove('abierto');
    mostrar('Listo. Toca el micrófono y háblame.');
  });
  document.getElementById('borrarMem').addEventListener('click', function () {
    memoria = { hechos: [], historial: [] }; guardarMemoria(); pintarRecuerdos();
  });

  /* ---------- Inicio ---------- */
  mostrar(leer('nova_clave', '') ? 'Toca el micrófono y háblame.' : 'Abre Ajustes y pega tu clave de Gemini para empezar.');

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
